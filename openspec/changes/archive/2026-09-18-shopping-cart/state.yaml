        summary: >
          Untested and, per code inspection, likely broken: CartViewModel's init block only
          promotes Loading -> Success when items.isNotEmpty() || current is
          CartUiState.Success (CartViewModel.kt:52). A genuinely empty first-fetch response may
          never re-emit through Room's Flow (deleteAll+insertAll on an already-empty table
          triggers no row-level invalidation), leaving the screen stuck on Loading forever
          instead of rendering the spec-mandated empty-state message with a zero subtotal.
        evidence: "verify-report.md, Issues Found > CRITICAL #1"
      - id: CRITICAL-2
        domain: cart-list
        scenario: "Cache present, background refresh fails"
        summary: >
          Untested: no CartViewModelTest case starts from a populated Success state and then
          fails a subsequent background repository.refresh() to assert cached items remain and
          no Error is shown. Code inspection suggests correct behavior but is not proven by a
          passing covering test.
        evidence: "verify-report.md, Issues Found > CRITICAL #2"
      - id: CRITICAL-3
        domain: cart-list
        scenario: "First load, no cache, network available"
        summary: >
          Untested as its own case: every CartViewModelTest case either starts with cache
          already present or starts with cache absent AND a failing refresh; the plain
          "no cache, refresh succeeds, Loading then Success" path independent of retry() has
          no dedicated assertion.
        evidence: "verify-report.md, Issues Found > CRITICAL #3"
